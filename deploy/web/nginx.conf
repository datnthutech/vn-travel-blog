# Cấu hình nginx của container vntraveltips-web (nginx:alpine, cổng 80 trong container → 127.0.0.1:8090 trên host).
# Phục vụ file tĩnh từ volume vntraveltips_data (gắn /data, chỉ đọc):
#   /data/site     — bản production        (host vntraveltips.monai.click)
#   /data/preview  — bản xem trước          (host nhap-vntraveltips.monai.click, có noindex)
#   /data/anh      — ảnh đã nén (mcp ghi, web đọc)
# Không có file tĩnh → hỏi vntraveltips-mcp (redirect 301 đọc từ redirects.json do build sinh, còn lại là 404).
# nginx trên HOST chỉ proxy tới đây; /mcp, /tai-anh, /oauth, /webhook/github, /.well-known/oauth- đi thẳng tới cổng 8091.

# Resolver của Docker: biến $mcp bên dưới được phân giải lúc có request, nên nginx nạp cấu hình được
# ngay cả khi container vntraveltips-mcp chưa lên (web vẫn phục vụ site/preview).
resolver 127.0.0.11 valid=10s ipv6=off;

# nginx trên host proxy sang đây bằng HTTP/1.0 nếu không đặt proxy_http_version; mặc định gzip chỉ nén HTTP/1.1
# → cho phép cả 1.0 để CSS/JS/JSON luôn được nén.
gzip_http_version 1.0;

# Redirect tự thêm "/" (vd /admin → /admin/) dùng Location tương đối. Nếu để tuyệt đối, nginx tự dựng từ cổng 80/http
# của container → mất https (production) hoặc mất cổng 8090 (local).
absolute_redirect off;

# Giao thức gốc do nginx host gửi sang; truy cập thẳng (local) thì không có header → dùng giao thức của container.
map $http_x_forwarded_proto $proto_goc {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name vntraveltips.monai.click localhost _;

    root /data/site;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;
    include /etc/nginx/bao-mat.conf;

    # Kiểm tra sức khoẻ của container (Dockerfile + compose dùng).
    location = /healthz-web {
        access_log off;
        return 200 "ok\n";
    }

    # File/thư mục ẩn của MCP trong thư mục ảnh (.gan-day.json, .upload-tmp, .tmp-*, .oauth-state.json) — không cho tải về.
    location ~ ^/anh/\. {
        return 404;
    }

    # Ảnh đã nén do MCP ghi. Tên thư mục là mã ngẫu nhiên, nội dung không đổi → cache 1 năm.
    location /anh/ {
        alias /data/anh/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/bao-mat.conf;
    }

    # Đường cũ /admin (Sveltia CMS đã gỡ) → trang quản trị mới /quan-tri/. Location tương đối (absolute_redirect off).
    location ~ ^/admin(/|$) {
        return 301 /quan-tri/;
    }

    # Không có file tĩnh → chuyển cho MCP (301 theo redirects.json, hoặc 404).
    location / {
        try_files $uri $uri/ @tra_cuu;
    }
    location @tra_cuu {
        set $mcp http://vntraveltips-mcp:8091;
        proxy_pass $mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $proto_goc;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # MCP không chạy được (đang build lần đầu, hoặc đang khởi động) → coi như không có trang, không lộ lỗi nội bộ.
        error_page 502 504 =404 /404.html;
    }
    error_page 404 /404.html;
}

server {
    listen 80;
    server_name nhap-vntraveltips.monai.click nhap.localhost;

    root /data/preview;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;
    include /etc/nginx/bao-mat.conf;

    # Bản xem trước có cả bài nháp: công khai nhưng không cho Google lập chỉ mục.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # File/thư mục ẩn của MCP trong thư mục ảnh — không cho tải về.
    location ~ ^/anh/\. {
        return 404;
    }

    location /anh/ {
        alias /data/anh/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/bao-mat.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
