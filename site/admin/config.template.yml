# Cấu hình Sveltia CMS cho /admin — MẪU. Lúc build, scripts/build-cms.mjs thay __GITHUB_REPO__ và __SITE_URL__
# rồi ghi ra dist/admin/config.yml.
# Chỉ để SỬA NHANH bài đã có (commit thẳng vào main). Tạo bài mới đi qua Claude/MCP; đăng/gỡ bài đi qua dang_bai/go_bai.
# Các trường phải khớp packages/schema (có test site/src/cms-config.test.ts canh).
backend:
  name: github
  repo: __GITHUB_REPO__
  branch: main
  base_url: __SITE_URL__        # proxy OAuth nằm ở server MCP (mcp/src/auth/cms-oauth.ts)
  auth_endpoint: oauth/cms/auth

site_url: __SITE_URL__
display_url: __SITE_URL__
locale: vi
publish_mode: simple
# Ảnh không đi qua CMS (đi qua trang tải ảnh /tai-anh), nên thư mục media chỉ là giá trị bắt buộc của cấu hình.
media_folder: site/public/_khong-dung
public_folder: /_khong-dung

collections:
  - name: bai-viet
    label: Bài viết
    label_singular: Bài viết
    folder: site/src/content/bai-viet
    extension: md
    format: frontmatter
    create: false      # tạo bài mới: nhờ Claude (tao_ban_nhap)
    delete: false      # gỡ bài: nhờ Claude (go_bai)
    identifier_field: tieuDe
    summary: "{{tieuDe}}"
    fields:
      - { name: tieuDe, label: Tiêu đề, widget: string }
      - { name: slug, label: Slug (URL), widget: string, readonly: true, hint: "Không đổi được: URL bài không được đổi sau khi đăng." }
      - name: moTa
        label: Mô tả (meta description)
        widget: text
        pattern: ['^[\s\S]{120,160}$', 'Mô tả phải dài 120–160 ký tự']
      - { name: loai, label: Loại bài, widget: select, options: [nhat-ky, review, top-list, cam-nang] }
      - { name: tinh, label: Tỉnh (slug), widget: string, required: false, readonly: true, hint: "Chỉ đọc: đổi tỉnh làm đổi URL bài nên phải nhờ Claude (sua_bai) để tự thêm redirect 301." }
      - { name: chuyenMuc, label: Chuyên mục, widget: select, multiple: true, required: false, options: [sinh-thai, an-uong, vui-choi, luu-tru, di-chuyen] }
      - { name: tags, label: Tags, widget: list, required: false }
      - name: anhBia
        label: Ảnh bìa
        widget: object
        fields:
          - { name: ma, label: Mã ảnh, widget: string, hint: "Lấy mã bằng nút “Tải ảnh” (góc phải dưới) hoặc nhờ Claude gọi liet_ke_anh." }
          - { name: alt, label: Alt (mô tả ảnh), widget: string }
      - { name: ngayDi, label: Ngày đi, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: ngayDang, label: Ngày đăng, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: ngayCapNhat, label: Ngày cập nhật, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - name: traNhanh
        label: Tra nhanh
        widget: object
        required: false
        fields:
          - { name: hopVoi, label: Hợp với, widget: string }
          - { name: thoiGian, label: Thời gian, widget: string }
          - { name: choO, label: Chỗ ở, widget: string, required: false }
          - { name: tongChiPhi, label: Tổng chi phí (đồng), widget: number, value_type: int, min: 0 }
          - { name: soNguoi, label: Số người, widget: number, value_type: int, min: 1 }
          - { name: diemThanThienVoiBe, label: Thân thiện với bé (1–5), widget: number, value_type: int, min: 1, max: 5 }
          - { name: diChuyen, label: Di chuyển, widget: string }
          - { name: thoiDiemNenDi, label: Thời điểm nên đi, widget: string }
          - { name: luuYVoiBe, label: Lưu ý với bé, widget: list, required: false }
      - name: diaDiem
        label: Địa điểm
        widget: list
        required: false
        fields:
          - { name: ten, label: Tên, widget: string }
          - { name: kieu, label: Kiểu, widget: select, options: [cho-o, quan-an, cho, khu-sinh-thai, diem-choi] }
          - { name: diaChi, label: Địa chỉ, widget: string, required: false }
          - name: toaDo
            label: Toạ độ
            widget: object
            required: false
            fields:
              - { name: lat, label: Vĩ độ, widget: number, value_type: float }
              - { name: lng, label: Kinh độ, widget: number, value_type: float }
          - { name: khoangGia, label: Khoảng giá, widget: string, required: false }
          - { name: gioMoCua, label: Giờ mở cửa, widget: string, required: false }
          - { name: thanThienVoiBe, label: Thân thiện với bé (ghi chú), widget: string, required: false }
          - { name: diem, label: Điểm (1–5), widget: number, value_type: int, min: 1, max: 5, required: false }
          - { name: uuDiem, label: Ưu điểm, widget: list, required: false }
          - { name: nhuocDiem, label: Nhược điểm, widget: list, required: false }
          - name: anh
            label: Ảnh
            widget: list
            required: false
            fields:
              - { name: ma, label: Mã ảnh, widget: string }
              - { name: alt, label: Alt, widget: string }
          - name: linkDat
            label: Link đặt (affiliate)
            widget: object
            required: false
            fields:
              - { name: nhaCungCap, label: Nhà cung cấp, widget: select, options: [agoda, klook, traveloka, booking, khac] }
              - { name: url, label: URL, widget: string }
      - name: doMangChoBe
        label: Đồ nên mang cho bé
        widget: list
        required: false
        fields:
          - { name: ten, label: Tên, widget: string }
          - { name: ghiChu, label: Ghi chú, widget: string, required: false }
          - { name: link, label: Link (affiliate), widget: string, required: false }
      - name: faq
        label: Câu hỏi thường gặp
        widget: list
        required: false
        fields:
          - { name: hoi, label: Câu hỏi, widget: string }
          - { name: dap, label: Trả lời, widget: text }
      - { name: hopTac, label: Bài hợp tác, widget: boolean, default: false }
      - { name: draft, label: Nháp, widget: boolean, default: false, readonly: true, hint: "Đăng/gỡ bài qua Claude: dang_bai (có kiểm tra bản xem trước) hoặc go_bai." }
      - { name: body, label: Nội dung, widget: markdown, hint: "Ảnh trong bài: ![mô tả ảnh](anh:MÃ_ẢNH). Alt không được để trống." }

  - name: tinh
    label: Tỉnh
    label_singular: Tỉnh
    folder: site/src/content/tinh
    extension: md
    format: frontmatter
    create: true       # MCP không có tool tạo tỉnh
    delete: false
    identifier_field: ten
    slug: "{{slug}}"
    summary: "{{ten}}"
    fields:
      - { name: ten, label: Tên, widget: string }
      - { name: slug, label: Slug, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Chỉ a-z, 0-9 và dấu gạch ngang'] }
      - { name: gioiThieu, label: Giới thiệu, widget: text }
      - name: anhBia
        label: Ảnh bìa
        widget: object
        fields:
          - { name: ma, label: Mã ảnh, widget: string, hint: "Lấy mã bằng nút “Tải ảnh” hoặc nhờ Claude gọi liet_ke_anh." }
          - { name: alt, label: Alt, widget: string }
      - { name: moTa, label: Mô tả, widget: text }
