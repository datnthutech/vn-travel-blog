# Header bảo mật cho site công khai. Được include ở cấp server VÀ trong mọi location có add_header riêng
# (nginx bỏ toàn bộ add_header của cấp trên khi một location tự có add_header).
# Cố ý KHÔNG đặt script-src / style-src / img-src: site dùng AdSense, GoatCounter, Pagefind — chặn script sẽ làm hỏng chúng.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
